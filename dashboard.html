<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Management System</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
}

.header {
  text-align: center;
  margin-bottom: 50px;
  color: white;
}

.header h1 {
  font-size: 40px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
}

.header p {
  font-size: 16px;
  opacity: 0.9;
  font-weight: 300;
}

.card-wrapper {
  display: grid;
  gap: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  transition: all 0.3s ease;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
}

.card-header {
  padding: 30px 25px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.icon {
  width: 50px;
  height: 50px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.visitor-icon {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.admin-icon {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}

.card-title {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.card-title h2 {
  font-size: 20px;
  color: #333;
  font-weight: 600;
}

.card-title p {
  font-size: 13px;
  color: #999;
}

.btn {
  display: block;
  width: 100%;
  padding: 14px 20px;
  border: none;
  background: white;
  color: #667eea;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.3s ease;
  border-top: 1px solid #f0f0f0;
}

.btn:hover {
  background: #f8f9ff;
}

.btn-visitor {
  color: #667eea;
}

.btn-admin {
  color: #f5576c;
}

.footer {
  text-align: center;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 40px;
  font-size: 13px;
}

@media (max-width: 600px) {
  .header h1 {
    font-size: 28px;
  }

  .card-header {
    padding: 25px 20px;
    gap: 15px;
  }

  .card-title h2 {
    font-size: 18px;
  }
}
</style>

</head>

<body>

<div class="container">
  <div class="header">
    <h1>Welcome</h1>
    <p>Visitor Management System</p>
  </div>

  <div class="card-wrapper">
    <!-- Visitor Card -->
    <div class="card">
      <a href="{{ url_for('visitor_login') }}" style="text-decoration: none;">
        <div class="card-header">
          <div class="icon visitor-icon">👤</div>
          <div class="card-title">
            <h2>Visitor Login</h2>
            <p>Register as a visitor</p>
          </div>
        </div>
        <button class="btn btn-visitor">Continue →</button>
      </a>
    </div>

    <!-- Admin Card -->
    <div class="card">
      <a href="{{ url_for('admin_login') }}" style="text-decoration: none;">
        <div class="card-header">
          <div class="icon admin-icon">🔐</div>
          <div class="card-title">
            <h2>Admin Panel</h2>
            <p>Manage visitor records</p>
          </div>
        </div>
        <button class="btn btn-admin">Continue →</button>
      </a>
    </div>
  </div>

  <div class="footer">
    <p>© 2026 Visitor Management System. All rights reserved.</p>
  </div>
</div>

</body>
</html>
